# Cloudflare Worker: Astrodynamics "Ask Claude" proxy.
# Deploy: `npm install` then `npx wrangler deploy` (from this worker/ dir).
# Secret (never in this file): `npx wrangler secret put ANTHROPIC_API_KEY`

name = "astro-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Comma-separated site origins allowed to call this Worker (CORS + guard).
# Add your production origin here before going live; localhost is for dev.
ALLOWED_ORIGINS = "https://fairflow.co.uk,http://localhost:8322"
# Output cap per reading, thinking included. Models + effort are the PRESETS
# allowlist in src/index.ts (the app's dropdown sends only a preset id).
MAX_TOKENS = "10000"
